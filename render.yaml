services:
  - type: web
    name: 10000-coders-ai-admissions
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: VOICE_WEBHOOK_URL
        sync: false
      - key: TWILIO_REQUEST_TIMEOUT
        value: "12"
      - key: GEMINI_API_KEY
        sync: false
      - key: GENIE_MODEL_NAME
        value: gemini-1.5-flash
